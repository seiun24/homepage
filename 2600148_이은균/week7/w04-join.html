<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>동아리 가입 신청</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 32px 20px;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #d0d8d0;
      }
      main {
        width: min(100%, 680px);
        margin: auto;
        padding: 28px;
        border: 1px solid #dbc9ff;
        border-radius: 18px;
        background: #f4f6f4;
        box-shadow: 0 14px 36px rgba(23, 32, 51, 0.09);
      }
      h1 {
        margin-top: 0;
        color: #173f68;
      }
      form,
      .field {
        display: grid;
        gap: 10px;
      }
      form {
        gap: 20px;
      }
      label,
      legend {
        font-weight: 700;
      }
      input,
      textarea {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #9cadbf;
        border-radius: 8px;
        font: inherit;
      }
      fieldset {
        display: grid;
        gap: 10px;
        margin: 0;
        padding: 16px;
        border: 1px solid #b9c8d7;
        border-radius: 10px;
      }
      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 20px;
      }
      .options label {
        display: inline-flex;
        align-items: center;
        gap: 7px;
      }
      .options input {
        width: auto;
      }
      :focus-visible {
        outline: 3px solid #2b7de9;
        outline-offset: 3px;
      }
      button {
        min-height: 46px;
        border: 0;
        border-radius: 10px;
        background: #173f68;
        color: #fff;
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>동아리 가입 신청</h1>

      <form>
        <div class="field">
          <label for="이름칸">이름</label>
          <input type="text" id="이름칸" name="이름" placeholder="예: 홍길동" />
        </div>

        <div class="field">
          <label for="비밀번호칸">비밀번호</label>
          <input type="password" id="비밀번호칸" name="비밀번호" />
        </div>

        <div class="field">
          <label for="메일칸">전자우편</label>
          <input
            type="email"
            id="메일칸"
            name="메일"
            placeholder="hongkd@kunsan.ac.kr"
          />
        </div>

        <div class="field">
          <label for="학번칸">학번</label>
          <input type="text" id="학번칸" name="학번" />
        </div>

        <fieldset>
          <legend>학년</legend>
          <div class="options">
            <label
              ><input type="radio" name="학년" value="1" checked />1학년</label
            >
            <label
              ><input type="radio" name="학년" value="2"/>2학년</label
            >
            <label
              ><input type="radio" name="학년" value="3"/>3학년</label
            >
            <label
              ><input type="radio" name="학년" value="4"/>4학년</label
            >
          </div>
        </fieldset>

        <fieldset>
          <legend>관심분야</legend>
          <div class="options">
            <label
              ><input
                type="checkbox"
                name="관심분야"
                value="디자인"
              />디자인</label
            >
            <label
              ><input type="checkbox" name="관심분야" value="기획" />기획</label
            >
            <label
              ><input type="checkbox" name="관심분야" value="개발" />개발</label
            >
          </div>
        </fieldset>

        <div class="field">
          <label for="날짜칸">희망 면담일</label>
          <input
            type="date"
            id="날짜칸"
            name="면담일"
            min="2026-10-01"
            max="2026-10-30"
          />
        </div>

        <div class="field">
          <label for="동기칸">가입동기</label>
          <textarea id="동기칸" name="가입동기" rows="5"></textarea>
        </div>

        <button type="submit">보내기</button>
      </form>
    </main>
  </body>
</html>
