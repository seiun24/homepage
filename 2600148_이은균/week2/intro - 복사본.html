<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이은균의 자기소개</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 600px;
        background-color: #ffffff;
        margin: 0 auto;
        padding: 20px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        border-radius: 8px;
      }

      h1 {
        color: #333;
        text-align: center;
      }

      .profile {
        display: flex;
        align-items: center;
        margin-bottom: 20px;
      }

      .profile img {
        border-radius: 50%;
        width: 100px;
        height: 100px;
        margin-right: 20px;
      }

      .profile-details {
        color: #555;
      }

      .profile-details p {
        margin: 0;
        font-size: 18px;
      }

      .intro {
        margin-top: 20px;
      }

      .intro h2 {
        font-size: 22px;
        color: #333;
      }

      .intro p {
        font-size: 16px;
        color: #666;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 학생의 이름을 표시하는 큰 제목 -->
      <h1>이은균의 자기소개</h1>

      <!-- 프로필 섹션 -->
      <div class="profile">
        <!-- 프로필 사진 -->
        <img src="1757427948533.jpg" alt="홍길동의 프로필 사진" />

        <!-- 학생의 기본 정보 -->
        <div class="profile-details">
          <p><strong>이름:</strong> 이은균</p>
          <p><strong>나이:</strong> 20세</p>
          <p><strong>취미:</strong> 게임, 여행</p>
        </div>
      </div>

      <!-- 간단한 자기소개 섹션 -->
      <div class="intro">
        <h2>자기소개</h2>
        <p>
          안녕하세요! 저는 이은균이라고 합니다. 코딩에 관심을 가지게 된지는 아직
          3년밖에 안됐지만, 배움과 탐구를 선호하는 성향을 가져, 성장을 하는
          모습을 보이고 싶습니다.
        </p>
        <p>
          앞으로 더 많은 경험과 커리어를 쌓으면서 성장해나가고 싶습니다 . 제
          꿈은 소니 코리아를 취업한 뒤 일본 지사로 넘어가서 IT 관련 직업을
          가지는 것 입니다.
        </p>
        <h2>배우고 싶은 것들</h2>
        <p>HTML5, SAP</p>
        <h2>희망 취업 분야</h2>
        <p>SAP 개발자</p>
        <h2>보유 기술</h2>
        <p>C, python</p>
      </div>
    </div>
  </body>
</html>
