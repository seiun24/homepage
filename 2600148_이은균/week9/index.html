<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>9주차css-1실습</title>
    <style>
      h1 {
        color: #ff88f1;
      }

      p {
        color: rgb(183, 10, 131);
      }
    </style>
  </head>
  <body>
    <h1>CSS 첫번째 연습</h1>
    <p>CSS를 통해서 HTML로 만든 구조에 스타일 시트를 적용해보자</p>
    <p>
      드디어 기본 설정이 아닌 내가 원하는 스타일로 변경해서 웹 페이지를 만들 수
      있어.
    </p>
  </body>
</html>
