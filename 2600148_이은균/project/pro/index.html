<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>SyncBeat - Web Rhythm Game</title>
    <style>
        body {
            background-color: #111;
            color: white;
            font-family: 'Malgun Gothic', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .active-screen { display: flex; }
        h1 { font-size: 42px; color: #00ffcc; text-shadow: 0 0 10px #00ffcc; margin-bottom: 30px; }
        .song-list { display: flex; gap: 20px; margin-bottom: 30px; }
        .song-card {
            background-color: #222; border: 2px solid #444; padding: 20px;
            border-radius: 10px; cursor: pointer; width: 150px; text-align: center; transition: 0.2s;
        }
        .song-card:hover { border-color: #00ffcc; transform: translateY(-5px); }
        .song-card.selected { border-color: #00ffcc; background-color: #1a332e; }
        .speed-control { margin-bottom: 30px; font-size: 18px; }
        .speed-btn {
            background: #333; color: white; border: none; padding: 10px 15px;
            margin: 0 5px; font-size: 16px; cursor: pointer; border-radius: 5px;
        }
        .speed-btn:hover { background: #555; }
        .start-btn {
            background: #00ffcc; color: #111; border: none; padding: 15px 40px;
            font-size: 22px; font-weight: bold; cursor: pointer; border-radius: 30px;
            box-shadow: 0 0 15px #00ffcc;
        }
        #game-container {
            position: relative; display: flex; width: 360px; height: 600px;
            background-color: rgba(20, 20, 20, 0.85); border: 4px solid #444; overflow: hidden; z-index: 2;
        }
        #video-background {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none; opacity: 0.3;
        }
        .lane { position: relative; width: 90px; height: 100%; border-right: 1px solid #333; box-sizing: border-box; }
        .lane:last-child { border-right: none; }
        #judgment-line {
            position: absolute; bottom: 50px; width: 100%; height: 6px;
            background-color: #00ffcc; box-shadow: 0 0 10px #00ffcc; z-index: 10;
        }
        .note {
            position: absolute; width: 100%; height: 25px;
            background: linear-gradient(to bottom, #ff0055, #ff5588); border-radius: 4px; top: -25px;
        }
        .key-guide { position: absolute; bottom: 10px; width: 100%; text-align: center; font-size: 18px; font-weight: bold; color: #666; }
        .lane.active { background-color: rgba(255, 255, 255, 0.15); }
        #ui-box { text-align: center; margin-top: 20px; min-height: 80px; z-index: 2;}
        #judgment-display { font-size: 28px; font-weight: bold; color: #ffcc00; margin-bottom: 5px; }
        #score-display { font-size: 18px; color: #aaa; }
        .result-box { background: #222; padding: 40px; border-radius: 15px; border: 2px solid #00ffcc; text-align: center; }
        .result-title { font-size: 32px; color: #00ffcc; margin-bottom: 20px; }
        .result-stat { font-size: 20px; margin: 10px 0; }
        .lobby-btn { background: #333; color: white; border: none; padding: 10px 20px; margin-top: 20px; cursor: pointer; border-radius: 5px;}
    </style>
    <script src="https://youtube.com"></script>
</head>
<body>

    <div style="position:absolute; top:-9999px; left:-9999px;"><div id="yt-api-player"></div></div>

    <div id="lobby-screen" class="screen active-screen">
        <h1>SyncBeat</h1>
        <div class="song-list">
            <div class="song-card selected" data-video="bvrEg5s0rg4" data-title="보컬로이드 신곡">
                <h3>보컬로이드 신곡</h3>
                <p>BPM 145</p>
            </div>
            <div class="song-card" data-video="m9S1A3K0HMc" data-title="J-POP 인디 밴드">
                <h3>인디 밴드송</h3>
                <p>BPM 130</p>
            </div>
        </div>
        <div class="speed-control">
            노트 속도: <button class="speed-btn" id="btn-speed-minus">-</button>
            <span id="speed-text">2.0배속</span>
            <button class="speed-btn" id="btn-speed-plus">+</button>
        </div>
        <button class="start-btn" id="btn-start">GAME START</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="video-background"></div>
        <div id="game-container">
            <div id="judgment-line"></div>
            <div class="lane" data-key="d"><div class="key-guide">D</div></div>
            <div class="lane" data-key="f"><div class="key-guide">F</div></div>
            <div class="lane" data-key="j"><div class="key-guide">J</div></div>
            <div class="lane" data-key="k"><div class="key-guide">K</div></div>
        </div>
        <div id="ui-box">
            <div id="judgment-display">광고 감지 및 대기 중...</div>
            <div id="score-display">SCORE: 0 | COMBO: 0</div>
        </div>
    </div>

    <div id="result-screen" class="screen">
        <div class="result-box">
            <div class="result-title">STAGE CLEAR</div>
            <div class="result-stat" id="res-title">곡 제목: -</div>
            <div class="result-stat" id="res-score">최종 점수: 0점</div>
            <div class="result-stat" id="res-combo">최대 콤보: 0</div>
            <button class="lobby-btn" id="btn-go-lobby">로비로 이동</button>
        </div>
    </div>

    <script>
        let currentVideoId = "bvrEg5s0rg4";
        let currentTitle = "보컬로이드 신곡";
        let noteSpeed = 2.0; 
        const baseDuration = 3.0;
        let player = null;
        let score = 0; let combo = 0; let maxCombo = 0;
        let gameInterval = null;
        const keyMap = { 'd': 0, 'f': 1, 'j': 2, 'k': 3 };

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('yt-api-player', {
                height: '100%', width: '100%', videoId: currentVideoId,
                playerVars: { 'autoplay': 0, 'controls': 0, 'rel': 0, 'disablekb': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        function onPlayerStateChange(event) {
            if (event.data == YT.PlayerState.PLAYING) {
                document.getElementById('judgment-display').innerText = "START!";
                if (!gameInterval) {
                    const duration = baseDuration / noteSpeed;
                    gameInterval = setInterval(() => spawnNote(duration), 600); 
                }
            } else if (event.data == YT.PlayerState.ENDED) { endGame(); }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const lanes = document.querySelectorAll('.lane');
            document.querySelectorAll('.song-card').forEach(card => {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.song-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    currentVideoId = card.dataset.video;
                    currentTitle = card.dataset.title;
                    if (player && player.cueVideoById) player.cueVideoById(currentVideoId);
                });
            });
            document.getElementById('btn-speed-minus').addEventListener('click', () => adjustSpeed(-0.5));
            document.getElementById('btn-speed-plus').addEventListener('click', () => adjustSpeed(0.5));
            document.getElementById('btn-start').addEventListener('click', startGame);
            document.getElementById('btn-go-lobby').addEventListener('click', goLobby);

            function adjustSpeed(amount) {
                noteSpeed = Math.max(1.0, Math.min(5.0, noteSpeed + amount));
                document.getElementById('speed-text').innerText = `${noteSpeed.toFixed(1)}배속`;
            }
            function changeScreen(screenId) {
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active-screen'));
                document.getElementById(screenId).classList.add('active-screen');
            }
            function startGame() {
                score = 0; combo = 0; maxCombo = 0;
                document.getElementById('score-display').innerText = "SCORE: 0 | COMBO: 0";
                document.getElementById('judgment-display').innerText = "광고 감지 및 대기 중...";
                changeScreen('game-screen');
                if (player) {
                    document.getElementById('video-background').appendChild(player.getIframe());
                    player.loadVideoById(currentVideoId);
                }
            }
            function spawnNote(duration) {
                const randomLane = Math.floor(Math.random() * 4);
                const targetLane = lanes[randomLane];
                if(!targetLane) return;
                const note = document.createElement('div');
                note.classList.add('note');
                note.style.animation = `fall ${duration}s linear forwards`;
                targetLane.appendChild(note);
                note.addEventListener('animationend', () => {
                    note.remove();
                    document.getElementById('judgment-display').innerText = "MISS";
                    document.getElementById('judgment-display').style.color = "#ff3333";
                    combo = 0; updateUI();
                });
            }
            function updateUI() {
                document.getElementById('score-display').innerText = `SCORE: ${score} | COMBO: ${combo}`;
                if (combo > maxCombo) maxCombo = combo;
            }
            window.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
